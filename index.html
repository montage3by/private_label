<head>

<title>Private Label · Отчёты</title>
<style>
:root{--bg:#f4f5f8;--surface:#fff;--ink:#131a2e;--ink-2:#4b5268;--line:#e2e4ec;--accent:#2a78d6}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px;display:grid;gap:16px}
h1{margin:0;font-size:26px}
p{margin:0;color:var(--ink-2)}
a.card{display:grid;gap:4px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card span{color:var(--ink-2);font-size:14px}
</style>
</head>
